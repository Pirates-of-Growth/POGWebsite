  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x); letter-spacing: 0.02em; line-height: 0.92; margin: 0 0 36px\">\n      We get in, get aligned,<br>and <span style=\"color: #A8842F\">get it done<\u002Fspan>.\n    <\u002Fh1>\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr; gap: 60px; align-items: end\">\n      <p style=\"font-size: 15px; line-height: 1.8; font-weight: 300; margin: 0; max-width: 560px; text-wrap: pretty\">\n        Pirates of Growth designs and builds signal-driven revenue systems for B2B scale-ups — from GTM strategy and ICP definition to a working HubSpot implementation your team opens every day.\n      <\u002Fp>\n      <div style=\"display: flex; gap: 14px; justify-content: flex-end; flex-wrap: wrap\">\n        <a href=\"#contact\" style=\"background: #1A1A18; color: #E8E6E1; padding: 16px 30px; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase\" style-hover=\"background: #A8842F; color: #1A1A18\">Get in touch<\u002Fa>\n        <a href=\"#system\" style=\"border: 1.5px solid #1A1A18; padding: 16px 30px; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase\" style-hover=\"border-color: #A8842F; color: #A8842F\">See the system ↓<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CLIENT LOGOS -->\n  <section data-screen-label=\"Clients\" style=\"border-top: 1.5px solid rgba(26,26,24,0.15); border-bottom: 1.5px solid rgba(26,26,24,0.15); background: #F8F6F2\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 26px 40px; display: flex; align-items: center; gap: 48px\">\n      <span style=\"font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.45; white-space: nowrap\">Trusted by<\u002Fspan>\n      <div style=\"flex: 1; overflow: hidden; position: relative; mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent)\">\n        <div style=\"display: flex; width: max-content; gap: 90px; align-items: center; animation: logo-marquee 28s linear infinite; padding-right: 90px\">\n          <div style=\"display: flex; gap: 90px; align-items: center\">\n            <img src=\"c4c741d8-1740-475f-b2c0-118da4bdc141\" alt=\"Effectory\" style=\"height: 36px; width: auto; display: block; opacity: 0.85\">\n            <img src=\"1b53fb32-5de1-42cb-b581-69933068734a\" alt=\"iwell\" style=\"height: 40px; width: auto; display: block; opacity: 0.85\">\n            <img src=\"8925a9d5-e524-4086-984f-d9191a624ff0\" alt=\"AlisQI\" style=\"height: 42px; width: auto; display: block; opacity: 0.85\">\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 90px; align-items: center\" aria-hidden=\"true\">\n            <img src=\"c4c741d8-1740-475f-b2c0-118da4bdc141\" alt=\"Effectory\" style=\"height: 36px; width: auto; display: block; opacity: 0.85\">\n            <img src=\"1b53fb32-5de1-42cb-b581-69933068734a\" alt=\"iwell\" style=\"height: 40px; width: auto; display: block; opacity: 0.85\">\n            <img src=\"8925a9d5-e524-4086-984f-d9191a624ff0\" alt=\"AlisQI\" style=\"height: 42px; width: auto; display: block; opacity: 0.85\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROBLEM -->\n  <section id=\"problem\" data-screen-label=\"Problem\" style=\"max-width: 1240px; margin: 0 auto; padding: 100px 40px\">\n    <div style=\"display: flex; align-items: center; gap: 14px; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.45; margin-bottom: 40px\">\n      <span>01 — The Problem<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: #1A1A18; opacity: 0.2\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: start\">\n      <h2 style=\"font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(38px, 4.5vw, 60px); letter-spacing: 0.02em; line-height: 1.02; margin: 0\">\n        Your buying signals exist.<br>Your system to act on them <span style=\"color: #A8842F\">doesn't<\u002Fspan>.\n      <\u002Fh2>\n      <div style=\"display: flex; flex-direction: column; gap: 24px\">\n        <p style=\"font-size: 14px; line-height: 1.8; font-weight: 300; margin: 0; text-wrap: pretty\">\n          Most B2B companies collect intent and account data but have no system to turn it into action. Signals live in disconnected tools, sales reps never see them, and outbound runs on gut feel instead of triggers.\n        <\u002Fp>\n        <p style=\"font-size: 14px; line-height: 1.8; font-weight: 300; margin: 0; text-wrap: pretty\">\n          We build the architecture that connects enrichment, scoring, and activation into one working system — so your team always knows which accounts are worth a conversation, and why.\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SYSTEM DIAGRAM -->\n  <section id=\"system\" data-screen-label=\"The System\" style=\"background: #1A1A18; color: #E8E6E1\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 100px 40px\">\n      <div style=\"display: flex; align-items: center; gap: 14px; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.5; margin-bottom: 40px\">\n        <span>02 — The System<\u002Fspan>\n        <span style=\"flex: 1; height: 1px; background: #E8E6E1; opacity: 0.2\"><\u002Fspan>\n        <span style=\"color: #C9A24B; opacity: 1\">Signal → Conversation<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(38px, 4.5vw, 60px); letter-spacing: 0.02em; line-height: 1.02; margin: 0 0 18px\">\n        One engine, wired into your stack.\n      <\u002Fh2>\n      <p style=\"font-size: 14px; line-height: 1.8; font-weight: 300; margin: 0 0 60px; max-width: 640px; opacity: 0.75; text-wrap: pretty\">\n        We follow the signal through the pipeline — from ICP foundation to a HubSpot cockpit your team works from every day.\n      <\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: 1fr 28px 1fr 28px 1fr 28px 1fr; gap: 0; align-items: stretch\">\n        <div style=\"border: 1.5px solid rgba(232,230,225,0.25); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-size: 10px; letter-spacing: 0.25em; color: #C9A24B\">01 · FOUNDATION<\u002Fdiv>\n          <div style=\"font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.04em; line-height: 1\">ICP &amp; Signals<\u002Fdiv>\n          <div style=\"font-size: 12px; line-height: 1.7; font-weight: 300; opacity: 0.7\">GTM strategy, ICP tiers, target list, signal taxonomy and scoring model.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: center; color: #C9A24B; font-size: 16px\">→<\u002Fdiv>\n        <div style=\"border: 1.5px solid rgba(232,230,225,0.25); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-size: 10px; letter-spacing: 0.25em; color: #C9A24B\">02 · ENRICH<\u002Fdiv>\n          <div style=\"font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.04em; line-height: 1\">Clay<\u002Fdiv>\n          <div style=\"font-size: 12px; line-height: 1.7; font-weight: 300; opacity: 0.7\">Firmographics, tech scans, hiring signals and contact waterfalls — one enriched, scored account.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: center; color: #C9A24B; font-size: 16px\">→<\u002Fdiv>\n        <div style=\"border: 1.5px solid rgba(232,230,225,0.25); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-size: 10px; letter-spacing: 0.25em; color: #C9A24B\">03 · STORE &amp; SCORE<\u002Fdiv>\n          <div style=\"font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.04em; line-height: 1\">HubSpot<\u002Fdiv>\n          <div style=\"font-size: 12px; line-height: 1.7; font-weight: 300; opacity: 0.7\">Clean data model, lifecycle stages, account scoring and a sales cockpit built on top.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: center; color: #C9A24B; font-size: 16px\">→<\u002Fdiv>\n        <div style=\"border: 1.5px solid #C9A24B; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-size: 10px; letter-spacing: 0.25em; color: #C9A24B\">04 · ACTIVATE<\u002Fdiv>\n          <div style=\"font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.04em; line-height: 1\">Outreach<\u002Fdiv>\n          <div style=\"font-size: 12px; line-height: 1.7; font-weight: 300; opacity: 0.7\">Signal-triggered campaigns and sequences, per persona — plus enablement for your team.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 28px; display: flex; align-items: center; gap: 14px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.5; flex-wrap: wrap\">\n        <span>Runs on<\u002Fspan>\n        <span style=\"border: 1px solid rgba(232,230,225,0.3); padding: 5px 12px\">HubSpot<\u002Fspan>\n        <span style=\"border: 1px solid rgba(232,230,225,0.3); padding: 5px 12px\">Clay<\u002Fspan>\n        <span style=\"border: 1px solid rgba(232,230,225,0.3); padding: 5px 12px\">AI Workflows<\u002Fspan>\n        <span style=\"border: 1px solid rgba(232,230,225,0.3); padding: 5px 12px\">LinkedIn<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SERVICES -->\n  <section id=\"services\" data-screen-label=\"Services\" style=\"max-width: 1240px; margin: 0 auto; padding: 100px 40px\">\n    <div style=\"display: flex; align-items: center; gap: 14px; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.45; margin-bottom: 40px\">\n      <span>03 — What We Do<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: #1A1A18; opacity: 0.2\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px\">\n\n      <div style=\"background: #F8F6F2; border: 1.5px solid rgba(26,26,24,0.15); padding: 40px 32px; display: flex; flex-direction: column; gap: 20px\" style-hover=\"border-color: #A8842F\">\n        <div style=\"font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: #A8842F\">Pillar 01<\u002Fdiv>\n        <h3 style=\"font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 0.03em; line-height: 1; margin: 0\">Revenue<br>Architecture<\u002Fh3>\n        <p style=\"font-size: 13px; line-height: 1.75; font-weight: 300; margin: 0; opacity: 0.75; text-wrap: pretty\">\n          The strategic blueprint before anything gets built.\n        <\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: auto; font-size: 12px; font-weight: 300\">\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>GTM strategy &amp; positioning<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>ICP definition &amp; tiering<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>Signal taxonomy &amp; trigger design<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>Pricing &amp; packaging<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #F8F6F2; border: 1.5px solid rgba(26,26,24,0.15); padding: 40px 32px; display: flex; flex-direction: column; gap: 20px\" style-hover=\"border-color: #A8842F\">\n        <div style=\"font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: #A8842F\">Pillar 02<\u002Fdiv>\n        <h3 style=\"font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 0.03em; line-height: 1; margin: 0\">HubSpot<br>Integration<\u002Fh3>\n        <p style=\"font-size: 13px; line-height: 1.75; font-weight: 300; margin: 0; opacity: 0.75; text-wrap: pretty\">\n          From strategy on paper to a CRM your team actually uses.\n        <\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: auto; font-size: 12px; font-weight: 300\">\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>Sales cockpit build<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>CRM &amp; data model optimization<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>Account &amp; lead scoring<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>Lifecycle stages, pipelines &amp; reporting<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #F8F6F2; border: 1.5px solid rgba(26,26,24,0.15); padding: 40px 32px; display: flex; flex-direction: column; gap: 20px\" style-hover=\"border-color: #A8842F\">\n        <div style=\"font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: #A8842F\">Pillar 03<\u002Fdiv>\n        <h3 style=\"font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 0.03em; line-height: 1; margin: 0\">System<br>Orchestration<\u002Fh3>\n        <p style=\"font-size: 13px; line-height: 1.75; font-weight: 300; margin: 0; opacity: 0.75; text-wrap: pretty\">\n          The tools connected, the program delivered.\n        <\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: auto; font-size: 12px; font-weight: 300\">\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>Clay + HubSpot + AI workflows<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>Enrichment &amp; outbound engineering<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>Strategic project &amp; program delivery<\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding-top: 10px; border-top: 1px solid rgba(26,26,24,0.12)\"><span style=\"color: #A8842F\">◆<\u002Fspan>Hands-on PM when you lack the staffing<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HOW WE WORK -->\n  <section id=\"process\" data-screen-label=\"How We Work\" style=\"border-top: 1.5px solid rgba(26,26,24,0.15); background: #F8F6F2\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 100px 40px\">\n      <div style=\"display: flex; align-items: center; gap: 14px; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.45; margin-bottom: 40px\">\n        <span>04 — How We Work<\u002Fspan>\n        <span style=\"flex: 1; height: 1px; background: #1A1A18; opacity: 0.2\"><\u002Fspan>\n        <span style=\"color: #A8842F; opacity: 1\">Diagnostic before execution<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 70px; margin-bottom: 60px\">\n        <h2 style=\"font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(38px, 4.5vw, 60px); letter-spacing: 0.02em; line-height: 1.02; margin: 0\">\n          Scope the real problem first. Then build.\n        <\u002Fh2>\n        <p style=\"font-size: 14px; line-height: 1.8; font-weight: 300; margin: 0; text-wrap: pretty\">\n          Every engagement starts with a structured diagnostic — a six-module review that scopes the real problem before any execution is quoted. No generic proposals.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 20px\">\n        <div style=\"border: 1.5px solid #A8842F; background: #E8E6E1; padding: 30px 26px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-family: 'Bebas Neue', sans-serif; font-size: 44px; line-height: 1; color: #A8842F\">00<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500\">Diagnostic<\u002Fdiv>\n          <div style=\"font-size: 12px; line-height: 1.7; font-weight: 300; opacity: 0.7\">Six-module review across GTM strategy, signal taxonomy, HubSpot architecture, outbound and enablement.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1.5px solid rgba(26,26,24,0.2); padding: 30px 26px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-family: 'Bebas Neue', sans-serif; font-size: 44px; line-height: 1; opacity: 0.35\">01<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500\">Signal Engine<\u002Fdiv>\n          <div style=\"font-size: 12px; line-height: 1.7; font-weight: 300; opacity: 0.7\">Foundation and enrichment: ICP, target list, scoring, Clay build and HubSpot data model.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1.5px solid rgba(26,26,24,0.2); padding: 30px 26px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-family: 'Bebas Neue', sans-serif; font-size: 44px; line-height: 1; opacity: 0.35\">02<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500\">Activation<\u002Fdiv>\n          <div style=\"font-size: 12px; line-height: 1.7; font-weight: 300; opacity: 0.7\">Outbound goes live: signal-triggered campaigns per persona, sequences, and team enablement.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1.5px solid rgba(26,26,24,0.2); padding: 30px 26px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"font-family: 'Bebas Neue', sans-serif; font-size: 44px; line-height: 1; opacity: 0.35\">03<\u002Fdiv>\n          <div style=\"font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500\">Measurement<\u002Fdiv>\n          <div style=\"font-size: 12px; line-height: 1.7; font-weight: 300; opacity: 0.7\">Dashboards, reporting and the business case — proof the system pays for itself.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACT -->\n  <section id=\"contact\" data-screen-label=\"Contact\" style=\"background: #1A1A18; color: #E8E6E1\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 100px 40px 80px\">\n      <div style=\"display: flex; align-items: center; gap: 14px; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.5; margin-bottom: 40px\">\n        <span>05 — Contact<\u002Fspan>\n        <span style=\"flex: 1; height: 1px; background: #E8E6E1; opacity: 0.2\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start\">\n        <div style=\"display: flex; flex-direction: column; gap: 28px\">\n          <h2 style=\"font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(44px, 5.5vw, 76px); letter-spacing: 0.02em; line-height: 0.98; margin: 0\">\n            Ready to turn signals into <span style=\"color: #C9A24B\">pipeline<\u002Fspan>?\n          <\u002Fh2>\n          <p style=\"font-size: 14px; line-height: 1.8; font-weight: 300; margin: 0; opacity: 0.75; max-width: 440px; text-wrap: pretty\">\n            Tell us where your revenue system is stuck. We'll come back with a straight answer on whether — and how — we can fix it.\n          <\u002Fp>\n          <a href=\"https://www.linkedin.com/in/vladimir-popu/\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 12px; border: 1.5px solid #E8E6E1; color: #E8E6E1; padding: 16px 28px; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; align-self: flex-start\" style-hover=\"border-color: #C9A24B; color: #C9A24B\">\n            Connect on LinkedIn →\n          <\u002Fa>\n        <\u002Fdiv>\n\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display: flex; flex-direction: column; gap: 18px; background: rgba(248,246,242,0.04); border: 1.5px solid rgba(232,230,225,0.2); padding: 40px\">\n          <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 20px 0\">\n              <div style=\"font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 0.03em; color: #C9A24B\">Message received.<\u002Fdiv>\n              <div style=\"font-size: 13px; font-weight: 300; opacity: 0.75; line-height: 1.7\">We'll get back to you within one business day.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n            <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.7\">\n              Name\n              <input type=\"text\" name=\"name\" required=\"required\" style=\"background: transparent; border: none; border-bottom: 1.5px solid rgba(232,230,225,0.3); color: #E8E6E1; font-family: 'DM Mono', monospace; font-size: 14px; padding: 10px 0; outline: none\" style-focus=\"border-bottom-color: #C9A24B\">\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.7\">\n              Work email\n              <input type=\"email\" name=\"email\" required=\"required\" style=\"background: transparent; border: none; border-bottom: 1.5px solid rgba(232,230,225,0.3); color: #E8E6E1; font-family: 'DM Mono', monospace; font-size: 14px; padding: 10px 0; outline: none\" style-focus=\"border-bottom-color: #C9A24B\">\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.7\">\n              What are you trying to fix?\n              <textarea rows=\"4\" name=\"message\" required=\"required\" style=\"background: transparent; border: none; border-bottom: 1.5px solid rgba(232,230,225,0.3); color: #E8E6E1; font-family: 'DM Mono', monospace; font-size: 14px; padding: 10px 0; outline: none; resize: vertical\" style-focus=\"border-bottom-color: #C9A24B\"><\u002Ftextarea>\n            <\u002Flabel>\n            <button type=\"submit\" style=\"background: #C9A24B; color: #1A1A18; border: none; padding: 16px 28px; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; cursor: pointer; margin-top: 8px\" style-hover=\"background: #E8E6E1\">\n              Send message\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background: #1A1A18; color: #E8E6E1; border-top: 1px solid rgba(232,230,225,0.15)\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.45\">\n      <span style=\"font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.06em; opacity: 1\">Pirates of Growth<\u002Fspan>\n      <span>Revenue Systems · GTM → HubSpot<\u002Fspan>\n      <span>© 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { sent: false };\n  renderVals() {\n    return {\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      onSubmit: (e) => {\n        e.preventDefault();\n        const f = e.target;\n        const name = f.elements.name.value;\n        const email = f.elements.email.value;\n        const message = f.elements.message.value;\n        const subject = encodeURIComponent('Website inquiry from ' + name);\n        const body = encodeURIComponent(message + '\\n\\n— ' + name + ' (' + email + ')');\n        window.location.href = 'mailto:vladimir@piratesofgrowth.com?subject=' + subject + '&body=' + body;\n        this.setState({ sent: true });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
